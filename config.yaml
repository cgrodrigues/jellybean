# Jellybean limits and thresholds. Every value has a default in
# `src/jellybean/settings.py`; this file documents and overrides them.

run:
  default_seed: 42                 # seed used when `--seed` is not given

limits:
  max_iterations_per_agent: 25     # tool-use turns before an agent is stopped
  token_budget_per_run: 4000000    # total LLM tokens per run (clean stop + partial report)
  tool_timeout_s: 300              # default per-tool timeout
  max_rework_cycles: 2             # critic-driven rework loops
  duckdb_memory_limit: 4GB         # per DuckDB connection; above it queries spill to <run>/tmp (null = 80% of RAM)
  duckdb_threads: 4                # threads per DuckDB connection (null = all cores)
  duckdb_max_temp_size: 50GB       # cap on data spilled to disk (null = DuckDB default)
  max_consecutive_tool_errors: 6   # an agent whose tool calls fail this many times in a row is stopped as blocked
  isolate_above_rows: 20000        # model fits on more rows run in a worker process, killed at the timeout (null = never)

tool_output:
  max_output_chars: 4000           # hard cap on a serialised ToolResult
  max_raw_rows: 20                 # hard cap on raw data rows returned by any tool

profiling:                         # keeps the profiler's checks cheap on large datasets
  distinct_max_rows: 5000000       # above this, integrity checks use the raw rows (exact duplicates not removed)
  exact_stats_max_rows: 5000000    # above this, column quantiles are approximate (distinct counts stay exact)
  sample_rows: 200000              # candidate relations are screened on a sample of about this size first
  candidate_batch: 60              # candidate relations tested per SQL statement

  # tool_timeouts:                 # timeout of single tools, overriding tool_timeout_s
  #   run_clustering: 900
  
features:
  window_max_rows: 200000000       # (entity, hour) or (entity, day) rows of the per-level window features; above it the window is skipped
  window_max_levels: 60            # category levels expanded into window features, over all columns

llm:                               # provider, model and key are set in .env
  max_tokens: 4096                 # max output tokens per model call
  temperature: null                # null = provider default
  request_timeout_s: 180
  max_retries: 3
  prompt_caching: true             # cache the stable prompt prefix (anthropic, bedrock)

join_confidence:                   # the system only auto-confirms a join if ALL hold
  min_coverage: 0.95               # share of primary rows with a match
  min_right_uniqueness: 0.999      # key uniqueness on the enrichment side
  max_fanout: 1.01                 # rows after join / rows before
  min_score_margin: 0.15           # score margin over the second-best candidate

pattern_registry:
  known_threshold: 0.85            # similarity >= this  -> known
  variant_threshold: 0.60          # similarity >= this  -> variant, below -> new

detection:
  lof_max_rows: 50000              # quadratic methods (LOF) sample above this size
  contamination: 0.01              # share of entities flagged by each outlier method
  contextual_contamination: 0.03   # share flagged inside each context group (global outliers use slots too)
  min_votes: 2                     # outlier methods that must agree before an entity is pooled
  min_group_size: 3                # smallest group of entities that becomes a finding
  group_distance: 0.5              # cosine distance used to group pooled outliers
  max_cluster_share: 0.02          # clusters larger than this share of entities are "normal"
  max_findings: 12                 # cap on candidate findings sent to the critic
  findings_per_family: 3           # feature-family groups: the best of each family...
  max_family_findings: 16          # ...with their own cap, on top of max_findings
  merge_overlap: 0.8               # merge findings when this share of the smaller one overlaps
  ts_threshold: 6.0                # robust z-score for time-series anomalies
  cluster_max_rows: 75000          # HDBSCAN is fitted on a seeded sample above this many entities (time grows with rows squared)
  group_max_pool: 10000            # most deviating pooled outliers grouped (pairwise distances: n^2 memory)
  plot_max_points: 50000           # population points drawn in a scatter plot (members are always drawn)
  fit_max_rows: 500000             # above this, outlier models are fitted on a seeded sample and score the rest in batches
  exact_population_max_rows: 500000  # above this, groups are compared with the whole population's statistics (computed once)
  surrogate_max_rows: 200000       # non-members sampled to fit the analyst's surrogate rules
  max_candidates_per_run: 500      # largest groups of one detection run kept before merging
  graph_max_edges: 2000000         # community detection and centrality refuse graphs with more edges

critic:
  min_stability: 0.6               # a finding below this stability cannot be "confirmed"
  stability_runs: 5                # repetitions with other seeds/subsamples
  stability_budget_share: 0.6      # share of the tool timeout stability_check may use before returning what it has
  stability_max_rows: 50000        # entities used to re-detect a finding (seeded sample plus its members)
  artifact_min_share: 0.5          # share of a finding explained by a source (file, nulls, cleaning op)
  artifact_min_lift: 5.0           # ... and its lift over the population, to suspect an artifact

masking:
  apply_to_run_sql: true           # also mask PII columns in run_sql row previews
  value_match_ratio: 0.5           # share of sampled values matching a PII pattern
  column_name_patterns:            # case-insensitive regexes on column names
    - "msisdn"
    - "phone"
    - "mobile"
    - "imei"
    - "imsi"
    - "iccid"
    - "e_?mail"
    - "(^|_)(first_|last_|full_|customer_)?name$"
    - "address"
    - "iban"
    - "passport"
    - "(^|_)nif$"
    - "(^|_)ssn$"
    - "(^|_)ip(_address)?$"
    - "destination_number"
    - "customer_id"
  value_patterns:                  # regexes on string values
    - "^\\+?\\d{9,15}$"                      # phone-like numbers
    - "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"       # e-mail addresses
    - "^[A-Z]{2}\\d{2}[A-Z0-9]{10,30}$"      # IBAN-like strings

# External sources: tables copied to a local snapshot before a run
# (`jellybean snapshot <source>`, `jellybean run --source <source>`).
# User and password come from the environment: JELLYBEAN_SOURCE_<NAME>_USER / _PASSWORD.
# Every parameter of this file is described in docs/config-reference.md.
# sources:
#   ch_prod:
#     type: clickhouse
#     host: localhost
#     port: 8123                   # null = default of the HTTP(S) interface
#     secure: false
#     database: telco
#     tables:                      # key = dataset name seen by the run
#       subscribers_events:
#         time_column: event_ts    # --from/--to filter on this column
#         entity_column: msisdn    # --sample keeps every row of the sampled entities
#       subscribers:
#         entity_column: msisdn
#       tariff_plans: {}           # no options: copied whole
