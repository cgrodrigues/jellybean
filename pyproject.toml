[project]
name = "jellybean"
version = "0.1.0"
description = "Multi-agent PoC that finds anomalies and patterns in Parquet datasets without exposing raw data to the LLM."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "duckdb>=2.0.0",
    "langchain-anthropic>=0.2",
    "langchain-aws>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyod>=3.6.7",
    "python-dotenv>=1.2.4",
    "pytz>=2026.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "typer>=0.29.0",
]

[project.scripts]
jellybean = "jellybean.cli:app"

[project.optional-dependencies]
# Optional explainability / dimensionality reduction (UMAP, SHAP).
explain = [
    "shap>=0.54.1",
    "umap-learn>=0.6.0",
]
# Optional deep-learning detectors (pyod AutoEncoder needs PyTorch, >1 GB).
deep = [
    "torch>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jellybean"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: end-to-end tests that call a real LLM (deselect with -m 'not llm')",
    "slow: long deterministic acceptance runs (about 15 min; run with -m slow)",
]
addopts = "-m 'not llm and not slow'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]
# Never touch documentation (ruff can format code blocks inside Markdown).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
