<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">Jellybean logo: a light blue jellybean looking through a magnifying glass</title>
  <defs>
    <clipPath id="lens"><circle cx="70" cy="44" r="17"/></clipPath>
  </defs>
  <!-- left arm, waving, with a glove -->
  <path d="M25,80 Q11,78 11,62" fill="none" stroke="#3f8fc4" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M25,80 Q11,78 11,62" fill="none" stroke="#8fd0f5" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="16.5" cy="55" r="3.2" fill="#fff" stroke="#2b3a55" stroke-width="1.4"/>
  <circle cx="10.5" cy="54" r="7" fill="#fff" stroke="#2b3a55" stroke-width="1.4"/>
  <rect x="5.5" y="60" width="11" height="4.5" rx="2.2" fill="#fff" stroke="#2b3a55" stroke-width="1.4"/>
  <!-- body, standing upright -->
  <g transform="translate(54 64) rotate(96) scale(1.75)">
    <path d="M-26,2 C-28,-10 -14,-16 -4,-10 C2,-6 8,-7 14,-11 C24,-16 32,-6 28,6 C24,18 6,20 -8,18 C-20,16 -25,10 -26,2 Z"
          fill="#8fd0f5" stroke="#3f8fc4" stroke-width="1.4"/>
    <path d="M-20,8 C-19,13 -14,15 -9,15" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <!-- plain eye -->
  <ellipse cx="41" cy="46" rx="7" ry="9" fill="#fff" stroke="#3f8fc4" stroke-width="1.5"/>
  <circle cx="43" cy="48" r="3.8" fill="#1f2333"/>
  <circle cx="44.3" cy="46.6" r="1.3" fill="#fff"/>
  <!-- smile -->
  <path d="M42,66 Q51,73 60,65" fill="none" stroke="#1f2333" stroke-width="2.4" stroke-linecap="round"/>
  <!-- magnifying glass over the other eye, which looks bigger through it -->
  <line x1="83" y1="57" x2="104" y2="80" stroke="#6b4a2b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="70" cy="44" r="17" fill="#eaf7ff"/>
  <g clip-path="url(#lens)">
    <ellipse cx="69" cy="45" rx="11.5" ry="14" fill="#fff" stroke="#3f8fc4" stroke-width="1.5"/>
    <circle cx="71" cy="47" r="6.8" fill="#1f2333"/>
    <circle cx="73.4" cy="44.4" r="2.3" fill="#fff"/>
  </g>
  <circle cx="70" cy="44" r="17" fill="none" stroke="#2b3a55" stroke-width="5"/>
  <!-- right arm and glove holding the handle -->
  <path d="M68,88 Q86,96 96,80" fill="none" stroke="#3f8fc4" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M68,88 Q86,96 96,80" fill="none" stroke="#8fd0f5" stroke-width="3.8" stroke-linecap="round"/>
  <rect x="89.5" y="78.5" width="11" height="4.5" rx="2.2" fill="#fff" stroke="#2b3a55" stroke-width="1.4" transform="rotate(-35 95 81)"/>
  <circle cx="97.5" cy="73" r="7" fill="#fff" stroke="#2b3a55" stroke-width="1.4"/>
  <circle cx="92" cy="69.5" r="3.2" fill="#fff" stroke="#2b3a55" stroke-width="1.4"/>
</svg>
